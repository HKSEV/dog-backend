spring.application.name=dog-backend

jwt.secret=yourVeryLongAndSecureSecretKeyForJwtTokenGeneration1234567890

spring.datasource.url=jdbc:mysql://localhost:3306/finddog?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=1234

# 콘솔에 실행되는 실제 sql문을 예쁘게 보여줌
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#이것을 빼먹으면 자동으로 ORM이 안됨
spring.jpa.hibernate.ddl-auto=update